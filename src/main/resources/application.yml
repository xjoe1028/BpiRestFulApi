server:
  port: 9998
spring:
  application:
    name: BpiRestFulApi

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mysql_local?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  thymeleaf:
    cache: false
    prefix: "classpath:/templates/app/"
    suffix: .html

  web:
    resources:
      static-locations:
        - classpath:/static/

  #  security:
  #    user:
  #      name: admin
  #      password: 123456

  jackson:
    default-property-inclusion: non-null # JSON處理時忽略非空字段
    serialization:
      fail-on-empty-beans: false
      indent-output: true

  # cache
  cache:
    type: redis

  # redis
  data:
    redis:
      repositories:
        enabled: true
      database: 0       # Redis資料庫索引（預設為0）
      host: 127.0.0.1   # Redis伺服器地址
      port: 6379        # Redis伺服器連線埠
      password:         # Redis伺服器連線密碼（預設為空）
      timeout: 5000     # 連線超時時間（毫秒）
      jedis:
        pool:
          max-active: 8 # 連線池最大連線數（使用負值表示沒有限制）
          max-wait: -1  # 連線池最大等待時間（使用負值表示沒有限制）
          max-idle: 8   # 連線池中的最大空閒連線
          min-idle: 0   # 連線池中的最小空閒連線

springdoc:
  api-docs: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    display-request-duration: true

# slf4j
logging:
  #  file:
  #    name: bpiRestFulApi.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: info
    org.springframework: info
    com.bpi: debug


# myBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml    # mapper映射文件
  type-aliases-package: com.bpi.model.entity  # 實體類所在的位置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   #console印sql

# openFeign
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# 自定義外部api url
api:
  coindesk:
    url: https://api.coindesk.com